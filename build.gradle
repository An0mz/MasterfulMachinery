plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id "me.shedaniel.unified-publishing" version "0.1.+"
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = 'io.ticticboom.mods.mm' // http://maven.apache.org/guides/mini/guide-naming-conventions.html

base {
    archivesName = mod_archive_name
}

// Mojang ships Java 21 to end users in 1.20.5+, so the mod targets Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

runs {
    configureEach {
        // Recommended logging data for a userdev environment.
        // The markers can be added/removed as needed, separated by commas.
        // "SCAN": For mods scan.
        // "REGISTRIES": For firing of registry events.
        // "REGISTRYDUMP": For getting the contents of all registries.
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        // Recommended logging level for the console.
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
        modSource project.sourceSets.test
    }

    client {
        workingDirectory project.file('run/client')
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'neoforge.enabledGameTestNamespaces', 'mm'
    }

    server {
        workingDirectory project.file('run/server')
        systemProperty 'neoforge.enabledGameTestNamespaces', 'mm'
        argument '--nogui'
    }

    // This run config launches the game test server and runs all registered gametests, then exits.
    // By default, the server will crash when no gametests are provided.
    // The gametest system is also enabled by default for other run configs under the /test command.
    gameTestServer {
        workingDirectory project.file('run/test_server')
        systemProperty 'neoforge.enabledGameTestNamespaces', 'mm'
    }

    data {
        workingDirectory project.file('run/data')
        // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
        arguments.addAll '--mod', 'mm', '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

subsystems {
    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Put repositories for dependencies here.
    // NeoGradle automatically adds the NeoForged maven and Maven Central for you.

    maven {
        name = "latvian"
        url = "https://maven.latvian.dev/releases"
    }
    maven {
        // location of the maven that hosts JEI files
        name = "Jared's maven"
        url = 'https://maven.blamejared.com/'
    }
    maven {
        // maven mirror for JEI files, as a fallback
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }
    maven {
        url 'https://maven.architectury.dev/'
        content {
            includeGroup 'dev.architectury'
        }
    }
    maven {
        url 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        url 'https://maven.saps.dev/minecraft'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.ftb.mods'
        }
    }
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // ForgeConfigAPIPort
}

// NeoForge ships Mixin, and production runs on Mojang mappings, so neither the Mixin
// annotation processor nor MixinExtras needs to be declared the way ForgeGradle required.
dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"

    // 1.18.24 predates Java 21 and cannot parse its class files.
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    // ========================
    // COMPILE MOD-ADDONS
    // ========================

    //JEI
    compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"

    //JADE (WAILA)
    compileOnly "curse.maven:jade-324717:${jade_id}"

    // MEKANISM
    compileOnly "curse.maven:mekanism-268560:${mekanism_id}"

    //PNEUMATICCRAFT (PNCR)
    compileOnly "curse.maven:pneumaticcraft-repressurized-281849:${pneumaticcraft_id}"

    //KUBEJS
    compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    // The Rhino artifact dropped its loader suffix on 1.21.1: rhino-forge -> rhino.
    compileOnly "dev.latvian.mods:rhino:${rhino_version}"
    compileOnly "dev.architectury:architectury-neoforge:${architectury_version}"

    // CREATE MOD
    // Registrate is intentionally absent: MM imports no Registrate classes, and the version Create
    // asks for (MC1.21-1.3.0+67) is not published to any public maven. transitive = false keeps
    // Create's own dependency graph off the classpath.
    compileOnly("com.simibubi.create:create-${mc_version}:${create_version}:slim") { transitive = false }
    // Ponder is required at compile time even though MM imports nothing from it: MM extends
    // Create's GeneratingKineticBlockEntity, whose supertype chain reaches
    // net.createmod.ponder.api.VirtualBlockEntity, and javac must resolve it.
    compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}"

    //BOTANIA
    // No 1.21.1 release upstream yet, only a work-in-progress branch. Re-enable alongside
    // io/ticticboom/mods/mm/cap/BotaniaCapabilities.java and
    // io/ticticboom/mods/mm/port/botania/mana/register/BotaniaManaPortBlockEntity.java,
    // the only two files in the mod that touch the Botania API.
    //compileOnly "vazkii.botania:Botania:${botania_version}"

    // ========================
    // RUNTIME MOD-ADDONS
    // ========================

    // PATCHOULI
    runtimeOnly "curse.maven:patchouli-306770:${patchouli_version}"

    // CURIOS
    runtimeOnly "curse.maven:curios-309927:${curios_version}"

    // CREATE MOD
    runtimeOnly("com.simibubi.create:create-${mc_version}:${create_version}:slim") { transitive = false }
    // Ponder and Flywheel renamed their artifacts for NeoForge:
    //   Ponder-Forge-1.20.1        -> ponder-neoforge (version carries the +mc1.21.1 suffix)
    //   flywheel-forge-1.20.1      -> flywheel-neoforge-1.21.1
    runtimeOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${mc_version}:${flywheel_version}"

    // JEI
    runtimeOnly "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    //JADE (WAILA)
    runtimeOnly "curse.maven:jade-324717:${jade_id}"

    // MEKANISM
    runtimeOnly "curse.maven:mekanism-268560:${mekanism_id}"

    //PNEUMATICCRAFT (PNCR)
    runtimeOnly "curse.maven:pneumaticcraft-repressurized-281849:${pneumaticcraft_id}"

    // KUBEJS
    runtimeOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    runtimeOnly "dev.latvian.mods:rhino:${rhino_version}"
    runtimeOnly "dev.architectury:architectury-neoforge:${architectury_version}"

    //BOTANIA
    //runtimeOnly "vazkii.botania:Botania:${botania_version}"

    // Dev-only conveniences carried over from 1.20.1. These are pinned to CurseForge file ids
    // that only exist for 1.20.1, so they are disabled until someone picks 1.21.1 ids for them.
    // None of them are compiled against, so nothing in the mod depends on them.
    //runtimeOnly "curse.maven:probejs-585406:5227399"                    // ProbeJS (KubeJS)
    //runtimeOnly "curse.maven:emi-580555:6420945"                        // EMI
    //runtimeOnly "curse.maven:immersive-engineering-231951:6206989"      // Immersive Engineering
    //runtimeOnly "curse.maven:spark-361579:4738952"                      // Spark profiler
}

// Expands the declared properties in neoforge.mods.toml so versions live in one place.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: mc_version,
            neo_version      : neoforge_version,
            mod_version      : mod_version,
            mod_authors      : mod_authors
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// Example for how to get properties into the manifest for reading at runtime.
jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_archive_name,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    // javac stops reporting after 100 errors by default, which hides the true scope of a
    // breaking change. Raise it so a failing build shows the whole picture at once.
    options.compilerArgs << '-Xmaxerrs' << '2000'
}

var fullname = "${mod_archive_name}-${mod_version} ${mod_stability_name}"

unifiedPublishing {
    project {
        gameVersions = [publish_mc_version]
        gameLoaders = [publish_modloader]
        displayName = fullname
        version = mod_version
        changelog = new File("${project.projectDir}/changelog.txt").text.replaceAll("VERSION_NAME", fullname)
        releaseType = mod_stability_name.toLowerCase()

        mainPublication tasks.jar

        var cfToken = System.getenv("CURSEFORGE_TOKEN")
        if (cfToken != null) {
            curseforge {
                token = cfToken
                id = publish_curseforge_id
            }
        }

        var mrToken = System.getenv("MODRINTH_TOKEN")
        if (mrToken != null) {
            modrinth {
                token = mrToken
                id = publish_modrinth_id
            }
        }
    }
}
