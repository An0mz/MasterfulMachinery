plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id "me.shedaniel.unified-publishing" version "0.1.+"
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = 'io.ticticboom.mods.mm' // http://maven.apache.org/guides/mini/guide-naming-conventions.html

base {
    archivesName = mod_archive_name
}

// Mojang ships Java 21 to end users in 1.20.5+, so the mod targets Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

runs {
    configureEach {
        // Recommended logging data for a userdev environment.
        // The markers can be added/removed as needed, separated by commas.
        // "SCAN": For mods scan.
        // "REGISTRIES": For firing of registry events.
        // "REGISTRYDUMP": For getting the contents of all registries.
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        // Recommended logging level for the console.
        systemProperty 'forge.logging.console.level', 'debug'

        // Both source sets have to be named. The bare modSource(SourceSet) form attaches every
        // source set to the project's own mod id, which put the test source set under "mm" and
        // left TestRoot's @Mod("mmtest") entrypoint dangling. This mirrors the two-mod layout the
        // 1.20.1 build declared through its mods { mm { ... } mmtest { ... } } block.
        modSources {
            add 'mm', project.sourceSets.main
            add 'mmtest', project.sourceSets.test
        }
    }

    client {
        workingDirectory project.file('run/client')
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'neoforge.enabledGameTestNamespaces', 'mm'
    }

    server {
        workingDirectory project.file('run/server')
        systemProperty 'neoforge.enabledGameTestNamespaces', 'mm'
        argument '--nogui'
    }

    // This run config launches the game test server and runs all registered gametests, then exits.
    // By default, the server will crash when no gametests are provided.
    // The gametest system is also enabled by default for other run configs under the /test command.
    gameTestServer {
        workingDirectory project.file('run/test_server')
        systemProperty 'neoforge.enabledGameTestNamespaces', 'mm'
    }

    data {
        workingDirectory project.file('run/data')
        // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
        arguments.addAll '--mod', 'mm', '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

minecraft {
    // NeoGradle does not pick the file up from its conventional location on its own here, and
    // without it AbstractContainerMenu.addSlot stays protected and every menu fails to compile.
    accessTransformers {
        file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')
    }
}

subsystems {
    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Put repositories for dependencies here.
    // NeoGradle automatically adds the NeoForged maven and Maven Central for you.

    maven {
        name = "latvian"
        url = "https://maven.latvian.dev/releases"
    }
    maven {
        // location of the maven that hosts JEI files
        name = "Jared's maven"
        url = 'https://maven.blamejared.com/'
    }
    maven {
        // maven mirror for JEI files, as a fallback
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }
    maven {
        url = "https://maven.ithundxr.dev/snapshots"
    } // Primary mirror for Registrate artifacts

    // Alternatively, you can use the Create Maven:
    // maven { url = "https://maven.createmod.net" }
    //}
    maven {
        url 'https://maven.architectury.dev/'
        content {
            includeGroup 'dev.architectury'
        }
    }
    maven {
        url 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        url 'https://maven.saps.dev/minecraft'
        content {
            includeGroup 'dev.latvian.mods'
        }
    }
    maven {
        url 'https://maven.ftb.dev/releases'
        content {
            includeGroup 'dev.ftb.mods'
        }
    }
    maven {
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup 'maven.modrinth'
        }
    } // Replication

    maven {
        url = "https://maven.blamejared.com"
        content {
            includeGroup 'com.hollingsworth.ars_nouveau'
        }
    } // Ars Nouveau

    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // ForgeConfigAPIPort
    maven {
        url = "https://maven.theillusivec4.top/"
        content {
            includeGroup 'top.theillusivec4.curios'
        }
    }
    maven {
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        content {
            includeGroup 'software.bernie.geckolib'
        }
    }
    maven {
        url = "https://maven.blakesmods.com/"
        content {
            includeGroupByRegex 'com\\.blakebr0\\..*'
        }
    }

    mavenCentral()
    maven { url = "https://jitpack.io" }
}

// NeoForge ships Mixin, and production runs on Mojang mappings, so neither the Mixin
// annotation processor nor MixinExtras needs to be declared the way ForgeGradle required.
dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"

    // 1.18.24 predates Java 21 and cannot parse its class files.
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    // ========================
    // COMPILE MOD-ADDONS
    // ========================

    // BlameJared
    compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    compileOnly "com.hrznstudio:titanium:${titanium_version}"
    compileOnly("com.hollingsworth.ars_nouveau:ars_nouveau-${mc_version}:${ars_nouveau_version}") { transitive = false }

    // ModMaven
    compileOnly "mekanism:Mekanism:${mekanism_version}"
    compileOnly "me.desht.pneumaticcraft:pneumaticcraft-repressurized:${pneumaticcraft_version}"

    // Create
    compileOnly("com.simibubi.create:create-${mc_version}:${create_version}:slim") { transitive = false }
    compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}"

    // Latvian, Architectury, FTB
    compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    compileOnly "dev.latvian.mods:rhino:${rhino_version}"
    compileOnly "dev.architectury:architectury-neoforge:${architectury_version}"
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }

    // Modrinth
    compileOnly "maven.modrinth:replication:${replication_version}"
    compileOnly "maven.modrinth:ae2:${ae2_version}"
    compileOnly "maven.modrinth:replication-ae2-bridge:${replication_ae2_bridge_version}"

    // CurseForge
    compileOnly "curse.maven:jade-324717:${jade_id}"
    compileOnly "curse.maven:nuclear-radiation-1148833:${nuclear_radiation_id}"
    compileOnly "curse.maven:projecte-226410:${projecte_id}"
    compileOnly "curse.maven:applied-flux-965012:${appflux_id}"
    compileOnly "curse.maven:applied-mekanistics-574300:${appmek_id}"
    compileOnly "curse.maven:ars-energistique-905641:${arseng_id}"
    compileOnly "curse.maven:applied-pneumatics-1355087:${appliedpneumatics_id}"
    compileOnly "software.bernie.geckolib:geckolib-neoforge-${mc_version}:${geckolib_version}"

    // Botania has no 1.21.1 release yet
    //compileOnly "vazkii.botania:Botania:${botania_version}"

    // ========================
    // RUNTIME MOD-ADDONS
    // ========================

    // BlameJared
    runtimeOnly "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"
    runtimeOnly "com.hrznstudio:titanium:${titanium_version}"
    runtimeOnly("com.hollingsworth.ars_nouveau:ars_nouveau-${mc_version}:${ars_nouveau_version}") { transitive = false }
    runtimeOnly "vazkii.patchouli:Patchouli:${patchouli_version}"
    runtimeOnly "blusunrize.immersiveengineering:ImmersiveEngineering:${immersive_engineering_version}"

    // ModMaven
    runtimeOnly "mekanism:Mekanism:${mekanism_version}"
    runtimeOnly "me.desht.pneumaticcraft:pneumaticcraft-repressurized:${pneumaticcraft_version}"
    runtimeOnly("com.buuz135:industrialforegoing:${industrial_foregoing_version}") { transitive = false }
    runtimeOnly "com.tterrag.registrate:Registrate:${registrate_version}"

    // Create
    runtimeOnly("com.simibubi.create:create-${mc_version}:${create_version}:slim") { transitive = false }
    runtimeOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${mc_version}:${flywheel_version}"

    // Latvian, Architectury
    runtimeOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    runtimeOnly "dev.latvian.mods:rhino:${rhino_version}"
    runtimeOnly "dev.architectury:architectury-neoforge:${architectury_version}"

    // TheIllusiveC4, GeckoLib, BlakeBR0, Maven Central
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    runtimeOnly "software.bernie.geckolib:geckolib-neoforge-${mc_version}:${geckolib_version}"
    runtimeOnly "com.blakebr0.mysticalagriculture:MysticalAgriculture:${mystical_agriculture_version}"
    runtimeOnly "com.blakebr0.cucumber:Cucumber:${cucumber_version}"
    runtimeOnly "org.appliedenergistics:guideme:${guideme_version}"

    // Modrinth
    runtimeOnly "maven.modrinth:replication:${replication_version}"
    runtimeOnly "maven.modrinth:ae2:${ae2_version}"
    runtimeOnly "maven.modrinth:replication-ae2-bridge:${replication_ae2_bridge_version}"

    // CurseForge
    runtimeOnly "curse.maven:jade-324717:${jade_id}"
    runtimeOnly "curse.maven:nuclear-radiation-1148833:${nuclear_radiation_id}"
    runtimeOnly "curse.maven:projecte-226410:${projecte_id}"
    runtimeOnly "curse.maven:applied-flux-965012:${appflux_id}"
    runtimeOnly "curse.maven:glodium-957920:${glodium_id}"
    runtimeOnly "curse.maven:applied-mekanistics-574300:${appmek_id}"
    runtimeOnly "curse.maven:ars-energistique-905641:${arseng_id}"
    runtimeOnly "curse.maven:applied-pneumatics-1355087:${appliedpneumatics_id}"
    runtimeOnly "curse.maven:probejs-585406:${probejs_id}"
    runtimeOnly "curse.maven:spark-361579:${spark_id}"
    runtimeOnly "curse.maven:factory-blocks-640001:${factory_blocks_id}"
    runtimeOnly "curse.maven:chisel-chipped-integration-971089:${chisel_chipped_id}"
    runtimeOnly "curse.maven:cryonicconfig-1208896:${cryonicconfig_id}"
    runtimeOnly "curse.maven:configured-457570:${configured_id}"
    runtimeOnly "curse.maven:modern-industrialization-405388:${modern_industrialization_id}"
    runtimeOnly "curse.maven:elemental-craft-395158:${elemental_craft_id}"
    runtimeOnly "curse.maven:datapack-anvil-432817:${dpanvil_id}"

    //runtimeOnly "vazkii.botania:Botania:${botania_version}"
}

// Expands the declared properties in neoforge.mods.toml so versions live in one place.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: mc_version,
            neo_version      : neoforge_version,
            mod_version      : mod_version,
            mod_authors      : mod_authors
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// Example for how to get properties into the manifest for reading at runtime.
jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_archive_name,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    // javac stops reporting after 100 errors by default, which hides the true scope of a
    // breaking change. Raise it so a failing build shows the whole picture at once.
    options.compilerArgs << '-Xmaxerrs' << '2000'
}

var fullname = "${mod_archive_name}-${mod_version} ${mod_stability_name}"

unifiedPublishing {
    project {
        gameVersions = [publish_mc_version]
        gameLoaders = [publish_modloader]
        displayName = fullname
        version = mod_version
        changelog = new File("${project.projectDir}/changelog.txt").text.replaceAll("VERSION_NAME", fullname)
        releaseType = mod_stability_name.toLowerCase()

        mainPublication tasks.jar

        var cfToken = System.getenv("CURSEFORGE_TOKEN")
        if (cfToken != null) {
            curseforge {
                token = cfToken
                id = publish_curseforge_id
            }
        }

        // publish_modrinth_id is optional, so the property has to be checked as well as the
        // token. Referencing an undefined property fails the build outright, which is what
        // happened before: the token check alone let it through and then blew up here.
        var mrToken = System.getenv("MODRINTH_TOKEN")
        if (mrToken != null && project.hasProperty("publish_modrinth_id")) {
            modrinth {
                token = mrToken
                id = project.property("publish_modrinth_id")
            }
        }
    }
}
