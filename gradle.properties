parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

jei_version=19.43.0.393
jade_id=7545219
# CurseForge file ids (1.21.1). Upstream versions, for reference:
#   Mekanism 1.21.1-10.7.19.85, PneumaticCraft Repressurized 8.2.23+mc1.21.1
mekanism_id=7904058
pneumaticcraft_id=8519226
kubejs_version=2101.7.2-build.368
rhino_version=2101.2.7-build.85
architectury_version=13.0.11

create_version=6.0.10-280
flywheel_version=1.0.6-42
ponder_version=1.0.87+mc1.21.1
# Create needs Registrate at runtime (its LavaSwimmingMixin references ItemEntry). This exact
# version is the one Create 6.0.10 declares; modmaven proxies it even though its index omits it.
registrate_version=MC1.21-1.3.0+67

patchouli_version=7730942
curios_version=6529130

# Botania has no 1.21.1 release yet (only a work-in-progress upstream branch), so the
# dependency and the two files that touch its API are disabled. See the Botania block in
# build.gradle for the details of what to re-enable.
#botania_version=

publish_mc_version=1.21.1
publish_modloader=neoforge

publish_curseforge_id=1643402

# Modrinth project id. build.gradle only publishes to Modrinth when this is set and
# MODRINTH_TOKEN is present, so leaving it commented out simply skips Modrinth.
#publish_modrinth_id=
